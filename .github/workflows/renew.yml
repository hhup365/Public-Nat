name: Nat-free-cloud Auto Task
on:
  schedule:
    - cron: "25 2 */2 * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
      actions: write

    steps:
      - name: 📥 检出当前仓库
        uses: actions/checkout@v4

      - name: 📥 拉取私库代码
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Test-nat-free-cloud
          token: ${{ secrets.GH_PAT }}
          path: private_code

      - name: 🔄 合并代码到工作区
        run: |
          rsync -a --exclude='.git' private_code/ ./
          rm -rf private_code

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libnss3 libxss1 libasound2t64 \
            libatk-bridge2.0-0 libgtk-3-0 libgbm1
          python -m seleniumbase install chrome

      - name: Download Proxy
        run: |
          SINGBOX_VERSION="1.13.11"
          curl -fsSL \
            "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz" \
            -o singbox.tar.gz
          tar -xzf singbox.tar.gz
          mv "sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box
          ./sing-box version

      - name: Run
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: python app.py

      - name: Write time.txt
        if: always()
        run: |
          TZ="Asia/Shanghai" date "+%Y-%m-%d %H:%M:%S BJT" >> time.txt

      - name: Commit time.txt
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add time.txt
          git diff --cached --quiet || git commit -m "chore: update time.txt [skip ci]"
          git push

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: screenshots/
          retention-days: 7
          if-no-files-found: ignore

      - name: 🧹 清理 Action 运行记录
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🧹 开始清理所有成功的 Action 运行记录（含本次）..."

          gh run list \
            --repo ${{ github.repository }} \
            --status success \
            --limit 100 \
            --json databaseId \
            -q '.[].databaseId' | while read run_id; do
              if [ "$run_id" != "${{ github.run_id }}" ]; then
                echo "  🗑️ 删除历史记录: $run_id"
                gh run delete "$run_id" --repo ${{ github.repository }}
              fi
          done

          echo "  ⏳ 等待本次记录状态落库..."
          sleep 10
          echo "  🗑️ 删除本次记录: ${{ github.run_id }}"
          gh run delete "${{ github.run_id }}" --repo ${{ github.repository }} || \
            echo "  ⚠️ 本次记录删除失败（可忽略，下次成功时会被清理）"

          echo "✅ 清理完成"
